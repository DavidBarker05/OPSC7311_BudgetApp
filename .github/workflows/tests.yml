name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches the downloaded dependencies and the build cache between runs. Only runs on master save it. Pull requests
      # just read master's copy, so they don't each fill the 10 GB of cache storage with their own
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest --console=plain

  instrumented-test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: database
            packages: com.example.mybudgettree.database
            firebase: true
          - suite: image storage
            packages: com.example.mybudgettree.imagestorage
            firebase: false
          - suite: ui
            packages: com.example.mybudgettree.ui
            firebase: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches the downloaded dependencies and the build cache between runs. Only runs on master save it. Pull requests
      # just read master's copy, so they don't each fill the 10 GB of cache storage with their own
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js (for the Firebase CLI)
        if: matrix.firebase
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The emulator download is large, so it is kept between runs. The key changes when firebase.json does
      - name: Cache the Firebase emulators
        if: matrix.firebase
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      # npm occasionally fails with a 404 for a package that was published minutes earlier and has not reached every
      # registry server yet, so the install is tried a few times before giving up
      - name: Install the Firebase CLI
        if: matrix.firebase
        run: |
          for attempt in 1 2 3; do
            npm install -g firebase-tools && exit 0
            echo "Installing the Firebase CLI failed (attempt $attempt of 3), trying again in 20 seconds"
            sleep 20
          done
          exit 1

      # Compiles the app and its tests before the emulator starts. Otherwise the compile runs while the emulator is
      # booting and sitting idle, which makes the runner's CPU a bottleneck for both, and the screen can lock again
      # during the long compile that used to sit between waking the emulator and starting the tests
      - name: Build the test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain

      # The key ends in a version so the snapshot can be thrown away: bump it if a bad emulator state ever gets saved into it
      # The AVD and its boot snapshot are kept between runs, so the emulator starts in seconds instead of cold booting.
      # The three instrumented jobs share one cache entry. Change the key when the api-level, target, arch or profile do
      - name: Cache the Android emulator
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34-google_apis-x86_64-pixel_6-v2

      # Only when there is no cache yet: boots the emulator once so its snapshot is saved into the cache
      - name: Create the emulator snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            echo "Generated the emulator snapshot for caching"

      - name: Run ${{ matrix.suite }} instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell input keyevent KEYCODE_HOME
            bash .github/scripts/run-instrumented-tests.sh "${{ matrix.packages }}" "${{ matrix.firebase }}"

      - name: Upload ${{ matrix.suite }} test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.suite }}-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          retention-days: 14
